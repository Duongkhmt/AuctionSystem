version: '3.8'

services:
  # 1. Database PostgreSQL 16
  postgres-db:
    image: postgres:16-alpine
    container_name: auction_postgres_db_dev
    restart: always
    environment:
      POSTGRES_DB: auction_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auction_system"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - auction-backend-network

  # 2. Backend Spring Boot API
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auction_backend_api_dev
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/auction_system
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres_password
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - auction-backend-network

networks:
  auction-backend-network:
    driver: bridge

volumes:
  postgres_data_dev:
    driver: local
