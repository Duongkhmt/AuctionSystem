# ===== SYSTEM & COMMON (9999, 1000) =====
UNCATEGORIZED_EXCEPTION=Lỗi hệ thống nội bộ không xác định
INVALID_REQUEST=Dữ liệu yêu cầu không hợp lệ

# ===== USER (1001 - 1099) =====
USER_NOT_FOUND=Không tìm thấy người dùng
UNAUTHORIZED_ACCESS=Bạn không có quyền chỉnh sửa sản phẩm này
USER_BANNED_FROM_BIDDING=Tài khoản của bạn hiện bị cấm tham gia đấu giá do vi phạm bùng đơn quá 3 lần

# ===== PRODUCT (1101 - 1199) =====
PRODUCT_NOT_FOUND=Không tìm thấy sản phẩm
IMAGE_REQUIRED=Sản phẩm cần tối thiểu 1 ảnh
TOO_MANY_IMAGES=Sản phẩm không được vượt quá 20 ảnh
INVALID_IMAGE_FILE=Ảnh phải thuộc định dạng JPG, PNG hoặc WebP và dưới 5MB
IMAGE_UPLOAD_FAILED=Tải ảnh sản phẩm lên Cloudinary thất bại
PRODUCT_NOT_PENDING_APPROVAL=Bài đăng sản phẩm không ở trạng thái chờ duyệt

# ===== CATEGORY (1201 - 1299) =====
CATEGORY_NOT_FOUND=Không tìm thấy danh mục
CATEGORY_INACTIVE=Danh mục hiện đang bị tạm ngưng

# ===== AUCTION (1301 - 1399) =====
AUCTION_NOT_FOUND=Không tìm thấy phiên đấu giá
RESERVE_PRICE_REQUIRED=Loại hình đấu giá RESERVE yêu cầu phải có giá bảo lưu
RESERVE_PRICE_NOT_ALLOWED=Giá bảo lưu không được phép dùng cho loại hình đấu giá này
RESERVE_PRICE_TOO_LOW=Giá bảo lưu không được thấp hơn giá khởi điểm
INVALID_AUCTION_TIME=Thời gian kết thúc phải diễn ra sau thời gian bắt đầu
START_TIME_IN_PAST=Thời gian bắt đầu không được ở quá khứ
AUCTION_DURATION_TOO_SHORT=Thời lượng phiên đấu giá phải tối thiểu 30 phút
AUCTION_ALREADY_STARTED=Phiên đấu giá đã bắt đầu hoặc kết thúc, không thể chỉnh sửa
CANNOT_DELETE_ACTIVE_AUCTION=Không thể xóa sản phẩm khi phiên đấu giá đang diễn ra hoặc đã kết thúc
CANNOT_CANCEL_STARTED_AUCTION=Phiên đấu giá đã bắt đầu hoặc kết thúc, người bán không thể tự hủy
AUCTION_EXPIRED_BEFORE_APPROVAL=Thời gian phiên đã trôi qua trong lúc chờ duyệt, không thể phê duyệt
AUCTION_NOT_RUNNING=Phiên đấu giá hiện không ở trạng thái đang diễn ra
AUCTION_NOT_STARTED=Phiên đấu giá chưa đến giờ bắt đầu
AUCTION_ENDED=Phiên đấu giá đã kết thúc
BUY_NOW_NOT_SUPPORTED=Sản phẩm này không hỗ trợ chế độ Mua Ngay
BUY_NOW_PRICE_NOT_SET=Lỗi dữ liệu: Sản phẩm Mua Ngay chưa có niêm yết giá mua ngay
AUCTION_NOT_RELISTABLE=Phiên đấu giá chỉ có thể đăng lại khi ở trạng thái HẾT HẠN hoặc ĐÃ HỦY
BUY_NOW_PRICE_REQUIRED=Loại hình MUA NGAY yêu cầu phải có giá mua ngay

# ===== BID (1401 - 1499) =====
CANNOT_BID_OWN_PRODUCT=Người bán không được tự đặt giá sản phẩm của chính mình
BID_AMOUNT_TOO_LOW=Mức giá đặt phải lớn hơn hoặc bằng giá hiện tại cộng bước giá tối thiểu
ALREADY_HIGHEST_BIDDER=Bạn đang là người dẫn đầu mức giá và không thể tự nâng giá đè lên chính mình
MAX_AUTO_BID_TOO_LOW=Mức giá trần Auto-bid phải lớn hơn hoặc bằng giá đặt khởi điểm

# ===== ORDER & PAYMENT (1501 - 1599) =====
ORDER_NOT_FOUND=Không tìm thấy thông tin đơn hàng trúng thầu
ORDER_ALREADY_PAID=Đơn hàng này đã được thanh toán trước đó
CANNOT_SHIP_UNPAID_ORDER=Không thể xuất hàng đối với đơn chưa thanh toán
ORDER_NOT_IN_SHIPPING_STATE=Đơn hàng không ở trạng thái đang giao
INVALID_PHONE_NUMBER=Số điện thoại nhận hàng không hợp lệ
