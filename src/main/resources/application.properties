spring.application.name=auction-service
server.port=${PORT:8080}

# DATABASE CONFIGURATION
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auction_system}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE CONFIGURATION
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# IMAGE UPLOAD
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# CLOUDINARY :
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dmyrfnxfv}
cloudinary.api-key=${CLOUDINARY_API_KEY:567893817722166}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:UXEZV0sENuJ1caxccS8P9H2dbCU}

# JACKSON CONFIGURATION (SNAKE_CASE)
spring.jackson.property-naming-strategy=SNAKE_CASE

# ===================================================================
# INTERNATIONALIZATION (i18n) CONFIGURATION
# ===================================================================
# Đường dẫn tên file gốc (Spring sẽ tự quét messages_vi.properties, messages_en.properties...)
spring.messages.basename=messages

# Ép kiểu đọc file UTF-8 để hiển thị chuẩn Tiếng Việt có dấu
spring.messages.encoding=UTF-8

# Ngôn ngữ mặc định của ứng dụng khi Client không gửi Header Accept-Language
spring.web.locale=vi

# Định hướng cho Spring Boot sử dụng Header Accept-Language từ HTTP Request
spring.web.locale-resolver=accept_header

# REDIS CACHING CONFIGURATION
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}
spring.data.redis.timeout=3000ms

# APP CLOUDINARY & IMAGE UPLOAD CUSTOM CONFIGURATION
app.cloudinary.folder=auction-products
app.cloudinary.resource-type=image
app.cloudinary.allowed-formats=jpg,jpeg,png,webp
app.cloudinary.max-file-size-mb=5
app.cloudinary.max-image-count=20

# ===================================================================
# APACHE KAFKA CONFIGURATION
# ===================================================================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Consumer Group Mặc Định Cho Hệ Thống
spring.kafka.consumer.group-id=auction-service-group

# Cấu hình Producer (Key là String, Value tự mã hóa JSON DTO)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Cấu hình Consumer (Key là String, Value tự giải mã JSON DTO)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Chuỗi Secret Key độ dài tối thiểu 256-bit để mã hóa chữ ký HMAC-SHA256
app.jwt.secret=${JWT_SECRET:DuAnTrainningAuctionSystemSecretKeyForJWTAuthentication2026123456789}
# Thời gian sống của Access Token:10 Phút = 600.000 ms
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:600000}


# ===================================================================
# 📧 CẤU HÌNH GỬI EMAIL QUA GMAIL SMTP
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# Thuộc tính đóng gói gọi từ biến môi trường .env (kèm fallback an toàn)
app.mail.from=${MAIL_FROM:${spring.mail.username:duongxlnt1234@gmail.com}}
app.frontend.public-url=${FRONTEND_PUBLIC_URL:http://localhost:4200}


# Các thuộc tính bảo mật SMTP của Google
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===================================================================
# EUREKA CLIENT & MICROSERVICES CONFIGURATION
# ===================================================================
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
# ===================================================================
# OPENFEIGN & RESILIENCE4J CIRCUIT BREAKER CONFIGURATION
# ===================================================================
feign.circuitbreaker.enabled=true
feign.client.config.default.connectTimeout=3000
feign.client.config.default.readTimeout=3000
# Cấu hình Resilience4j Circuit Breaker cho PAYMENT-SERVICE
resilience4j.circuitbreaker.instances.PAYMENT-SERVICE.slidingWindowSize=10
resilience4j.circuitbreaker.instances.PAYMENT-SERVICE.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.PAYMENT-SERVICE.failureRateThreshold=50
resilience4j.circuitbreaker.instances.PAYMENT-SERVICE.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.PAYMENT-SERVICE.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.PAYMENT-SERVICE.automaticTransitionFromOpenToHalfOpenEnabled=true



