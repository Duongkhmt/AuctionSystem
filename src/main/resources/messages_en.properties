# ===== SYSTEM & COMMON (9999, 1000) =====
UNCATEGORIZED_EXCEPTION=Uncategorized internal server error
INVALID_REQUEST=Invalid request payload

# ===== USER (1001 - 1099) =====
USER_NOT_FOUND=User not found
UNAUTHORIZED_ACCESS=You do not have permission to modify this product
USER_BANNED_FROM_BIDDING=Your account is currently banned from bidding due to defaulting on orders more than 3 times

# ===== PRODUCT (1101 - 1199) =====
PRODUCT_NOT_FOUND=Product not found
IMAGE_REQUIRED=Product requires at least 1 image
TOO_MANY_IMAGES=Product cannot exceed 20 images
INVALID_IMAGE_FILE=Image must be JPG, PNG, or WebP format and under 5MB
IMAGE_UPLOAD_FAILED=Failed to upload product image to Cloudinary
PRODUCT_NOT_PENDING_APPROVAL=Product post is not in pending approval status

# ===== CATEGORY (1201 - 1299) =====
CATEGORY_NOT_FOUND=Category not found
CATEGORY_INACTIVE=Category is currently inactive

# ===== AUCTION (1301 - 1399) =====
AUCTION_NOT_FOUND=Auction session not found
RESERVE_PRICE_REQUIRED=RESERVE auction type requires a reserve price
RESERVE_PRICE_NOT_ALLOWED=Reserve price is not allowed for this auction type
RESERVE_PRICE_TOO_LOW=Reserve price cannot be lower than the starting price
INVALID_AUCTION_TIME=End time must be after start time
START_TIME_IN_PAST=Start time cannot be in the past
AUCTION_DURATION_TOO_SHORT=Auction duration must be at least 30 minutes
AUCTION_ALREADY_STARTED=Auction has already started or ended and cannot be modified
CANNOT_DELETE_ACTIVE_AUCTION=Cannot delete product while auction is ongoing or completed
CANNOT_CANCEL_STARTED_AUCTION=Auction has started or ended, seller cannot cancel manually
AUCTION_EXPIRED_BEFORE_APPROVAL=Auction time elapsed while pending approval, cannot approve
AUCTION_NOT_RUNNING=Auction is currently not active
AUCTION_NOT_STARTED=Auction has not started yet
AUCTION_ENDED=Auction has ended
BUY_NOW_NOT_SUPPORTED=This product does not support Buy Now mode
BUY_NOW_PRICE_NOT_SET=Data error: Buy Now product has no listed Buy Now price
AUCTION_NOT_RELISTABLE=Auction can only be relisted when in EXPIRED or CANCELLED status
BUY_NOW_PRICE_REQUIRED=BUY_NOW mode requires a buy now price

# ===== BID (1401 - 1499) =====
CANNOT_BID_OWN_PRODUCT=Sellers are not allowed to bid on their own products
BID_AMOUNT_TOO_LOW=Bid amount must be greater than or equal to current price plus minimum bid increment
ALREADY_HIGHEST_BIDDER=You are already the highest bidder and cannot outbid yourself
MAX_AUTO_BID_TOO_LOW=Maximum auto-bid price must be greater than or equal to initial bid price

# ===== ORDER & PAYMENT (1501 - 1599) =====
ORDER_NOT_FOUND=Winning order information not found
ORDER_ALREADY_PAID=This order has already been paid
CANNOT_SHIP_UNPAID_ORDER=Cannot ship an unpaid order
ORDER_NOT_IN_SHIPPING_STATE=Order is not in shipping status
INVALID_PHONE_NUMBER=Invalid shipping phone number
